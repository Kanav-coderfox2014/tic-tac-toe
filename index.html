<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="easy-theme">

    <!-- Confetti -->
    <div id="confetti-container"></div>


    <main class="game-container">

        <h1>Tic-Tac-Toe</h1>

        <p class="difficulty-label">
            Choose Difficulty
        </p>


        <!-- Difficulty Buttons -->

        <div class="difficulty-buttons">

            <button
                id="easy-btn"
                class="difficulty-btn easy-btn active"
            >
                Easy
            </button>

            <button
                id="medium-btn"
                class="difficulty-btn medium-btn"
            >
                Medium
            </button>

            <button
                id="hard-btn"
                class="difficulty-btn hard-btn"
            >
                Hard
            </button>

        </div>


        <p id="status">
            Your turn (X)
        </p>


        <!-- Game Board -->

        <div class="board" id="board">

            <!-- Winning line -->
            <div id="winning-line"></div>


            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>


        <button id="restart-btn">
            Restart Game
        </button>

    </main>


    <!-- Winner Popup -->

    <div id="winner-popup" class="popup-overlay">

        <div class="winner-popup">

            <div class="trophy">
                🏆
            </div>

            <h2 id="winner-title">
                You Win!
            </h2>

            <p id="winner-message">
                Congratulations!
            </p>

            <button id="popup-restart-btn">
                Play Again
            </button>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
